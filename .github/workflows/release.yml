name: release
# Publishes to npm when a tag v<version> is pushed, e.g. v0.2.0-draft.3.
# The tag must match package.json. A prerelease goes out under the dist-tag
# `draft`, and becomes `latest` too while no stable version exists.
# Needs the repository secret NPM_TOKEN (an npm automation token).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          case "$VERSION" in
            *-*)
              npm publish --access public --provenance --tag draft
              stable=$(npm view "$name" versions --json | node -e "const v=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log([].concat(v).some(x=>!x.includes('-'))?'yes':'no')")
              if [ "$stable" = no ]; then npm dist-tag add "$name@$VERSION" latest; fi
              ;;
            *) npm publish --access public --provenance ;;
          esac
      - name: Check the registry
        run: |
          name=$(node -p "require('./package.json').name")
          for i in 1 2 3 4 5 6; do
            npm view "$name@$VERSION" version && exit 0
            sleep 10
          done
          echo "$name@$VERSION is not on the registry"; exit 1
